[package]
name = "merma"
version = "0.1.0"
edition = "2021"
description = "AI-subscription waste meter: how much of your Claude Code and Codex plans you left on the table"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
memchr = "2"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = 3
