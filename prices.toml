# merma price tables — data, not code. USD per 1M tokens unless noted.
# Validity windows: [from, until) in UTC dates; omit `until` for open-ended.
# `approx = true` → price not verified from an official source for that era;
# every approx-priced dollar is surfaced in report footnotes, never silently blended.
#
# To override: copy this file to ~/.merma/prices.toml and edit. The override
# REPLACES the embedded table entirely (no partial merge, no silent fallback).
#
# Sources (fetched 2026-08-07):
#   platform.claude.com/docs/en/about-claude/pricing
#   developers.openai.com/api/docs/pricing (post-2026-07-30 cut: terra -20%, luna -80%, others unchanged)
#   help.openai.com/en/articles/20001106-codex-rate-card (credits, effective 2026-04-02)
#   openrouter.ai/openai/gpt-5.1, tldl.io/resources/openai-api-pricing (historical eras)

